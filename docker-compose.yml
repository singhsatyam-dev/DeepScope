services:
  postgres:
    image: postgres:17-alpine
    container_name: researchpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: researchpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: researchpilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - researchpilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchpilot -d researchpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: researchpilot-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - researchpilot-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: researchpilot-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://researchpilot:${POSTGRES_PASSWORD}@postgres:5432/researchpilot?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  researchpilot-postgres-data:
    external: true
  researchpilot-redis-data:
    external: true
